name: CI

# Must live at the REPOSITORY root -- GitHub Actions does not pick up
# .github/workflows from a subdirectory. The project itself lives in
# duui_bundestag_pipeline/, hence the working-directory below.
on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: duui_bundestag_pipeline

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: duui_bundestag
          POSTGRES_USER: duui
          POSTGRES_PASSWORD: duui
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U duui -d duui_bundestag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DUUI_DB_NAME: duui_bundestag
      DUUI_DB_USER: duui
      DUUI_DB_PASSWORD: duui
      DUUI_DB_HOST: localhost

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r importer/requirements.txt -r requirements-dev.txt

      - name: Apply schema
        run: psql "postgresql://duui:duui@localhost:5432/duui_bundestag" -f db/schema.sql

      - name: Run tests
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Each image has its own build script; build-all.sh runs all three
      # (and is what a human would run locally, so CI exercises the same
      # path rather than a separate set of docker build invocations).
      - name: Build all images
        run: ./build-all.sh
