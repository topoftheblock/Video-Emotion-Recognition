[tool.pytest.ini_options]
# Runs all three suites in one go from the stack root. Each container's
# code lives entirely in its own directory under a `src/` source root, so
# all of those go on the path: that's what makes `import importer`
# (importer), `import backend` (viewer) and `import identity` (the
# cross-video identity job) resolve exactly as they do in the respective
# images. The three packages are named differently on purpose -- all
# source roots share one path here, so a common name would shadow.
#
# Each directory also has its own pyproject.toml, so
# `cd cas-to-postgres-importer && pytest` (or either of the
# other two) works standalone -- this file is only the "run everything"
# convenience.
pythonpath = [
    "cas-to-postgres-importer/src",
    "webapp/src",
    "global-identity-linker/src",
]
testpaths = [
    "cas-to-postgres-importer/tests",
    "webapp/tests",
    "global-identity-linker/tests",
]

# --- Formatting and linting -----------------------------------------------
# One configuration for all four sub-projects. Their own pyproject.toml files
# carry pytest settings only and no [tool.ruff] section, which ruff skips when
# it looks for configuration, so every file in the repository is governed from
# here and the four cannot drift apart.
[tool.ruff]
# 88 for code, matching docs/documentation-style.md section 8. Prose in comments
# and docstrings wraps at 72 there; that stays a human rule, because the
# formatter does not reflow comments and E501 cannot distinguish prose from code.
line-length = 88

# The runtime, not whatever interpreter happens to run ruff. Nothing in this
# repository is a distribution, so there is no requires-python for ruff to read.
target-version = "py314"

[tool.ruff.lint]
# Deliberately narrow to start: pyflakes (F), pycodestyle errors (E) and import
# sorting (I). These are the rules the style guide already implies, and none of
# them asks for a judgement call.
#
# Opinionated families are left off on purpose. Docstring rules (D) in
# particular would fire on almost every function, since Phase 5 has not
# rewritten the docstrings yet -- turning them on now would bury the errors that
# mean something. Revisit once Phase 5 is done.
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
# The three package names, so their imports sort as first-party rather than
# being mistaken for third-party ones.
known-first-party = ["importer", "backend", "identity"]

[tool.ruff.lint.per-file-ignores]
# 224 lines of UIMA type names and injected fallback type definitions, most of
# them inside XML string literals. Wrapping those to satisfy a line limit
# written for code would corrupt data. It is a data file that happens to end
# in .py.
"cas-to-postgres-importer/src/importer/cas/types.py" = ["E501"]

# 332 lines of prose inside one string constant, describing the database
# to a language model. It is a prompt, not documentation for a human
# reader, and rewrapping it would change what the model is given. Left as
# written by decision — see docs/plan/phase-5-documentation.md, Q3.
"webapp/src/backend/query_agent/schema_context.py" = ["E501"]

[tool.mypy]
# The runtime, not whatever interpreter runs mypy.
python_version = "3.14"

# Lenient here, strict per sub-project. Strictness is not configured in this
# file, because it has to apply to a sub-project's `tests` as well as its `src`,
# and a test module has no package name to match on -- all three sub-projects
# own a plain `conftest`. So the ratchet lives where it can be expressed: the
# list of finished sub-projects in tests/run-lint.sh, which passes
# `--disallow-untyped-defs` for those and nothing for the rest.
#
# When the last sub-project finishes, that split collapses into
# `disallow_untyped_defs = true` on the line below.
ignore_missing_imports = true
