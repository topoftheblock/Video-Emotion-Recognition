[tool.pytest.ini_options]
# `src` is the source root (not a package), so putting it on the path
# is what makes `import identity` resolve the same way it does inside
# the container (where it is copied to /app/src and exported as
# PYTHONPATH). Lets `cd global-identity-linker && pytest`
# work on its own; the stack root's pyproject.toml runs this suite
# together with the other two.
pythonpath = ["src"]
testpaths = ["tests"]
