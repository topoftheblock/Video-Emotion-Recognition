# Accessibility regression checks — kept, but inactive and unneeded.
#
# Phase 6.3 of accessibility.md, next to this file. It does nothing
# where it sits: GitHub Actions reads workflows only from
# `.github/workflows/` at the *repository root*, the parent of
# `duui-video-emotion-visualization`.
#
# WHY IT IS INERT
#
# Not for want of CI. The repository has two workflows, one of them for
# this project, and a `paths:` filter keeps a workflow from touching the
# sibling projects — so the reason this file used to give, that adding a
# workflow "introduces GitHub Actions to all of them", was wrong twice
# over.
#
# The real reason is that it is redundant. The five suites it runs are
# part of the project suite, and the project workflow already runs the
# whole suite on every push and pull request touching this directory:
#
#     .github/workflows/duui-video-emotion-visualization.yml
#
# So the checks below already run in CI. This file would run them a
# second time, in a second job, against a hand-maintained list of test
# files that has to be kept in step with the directory.
#
# It is kept because it is the one thing that would still be useful if
# the accessibility checks ever needed to run on their own — against a
# different trigger, say, or without the rest of the suite.
#
# TO ACTIVATE IT ANYWAY
#
# From the repository root:
#
#     mkdir -p .github/workflows
#     git mv duui-video-emotion-visualization/webapp/docs/a11y-ci.yml \
#            .github/workflows/accessibility.yml
#
# The `paths:` filters and `working-directory:` below are already
# written relative to the repository root, so they need no adjustment.
# Note that `pull_request:` below carries no `paths:` filter and so
# would run on every pull request in the repository; add one before
# turning this on.
#
# WHAT IT COVERS
#
# The pure-function half of the checks: no browser, no database, no
# application dependencies, just pytest over values committed to the
# repository. The browser half — five axe states and the keyboard
# sweep — is webapp/tests/a11y_browser_check.js, and stays a manual
# procedure. See the note at the bottom of that file for why.

name: Accessibility

on:
  push:
    paths:
      - "duui-video-emotion-visualization/webapp/src/frontend/**"
      - "duui-video-emotion-visualization/webapp/tests/**"
      - ".github/workflows/accessibility.yml"
  pull_request:
  workflow_dispatch:

jobs:
  contrast-and-palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Deliberately not the project's requirements files: these two
      # suites import nothing but the standard library, and keeping the
      # job free of application dependencies is what makes it fast and
      # what stops an unrelated dependency break from masking a contrast
      # regression.
      - run: pip install pytest

      # Named individually rather than pointed at tests/, because the
      # rest of that directory needs the application's own dependencies
      # (a database, an LLM client) and this job deliberately has none.
      - name: Accessibility checks
        working-directory: duui-video-emotion-visualization/webapp
        run: |
          pytest \
            tests/test_contrast.py \
            tests/test_palette.py \
            tests/test_markup.py \
            tests/test_stylesheets.py \
            tests/test_scripts.py \
            -q -p no:cacheprovider

      # Printed on success too: the reports are the useful artifact when
      # someone is changing a color and wants to see the margins, not
      # just whether the thresholds held.
      - name: Report
        if: always()
        working-directory: duui-video-emotion-visualization/webapp
        run: |
          python3 tests/support/contrast_check.py || true
          python3 tests/support/cvd_check.py || true
