<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUUI Emotion Visualization</title>
<!-- rx matches --theme-rounded-base, fill is primary-500. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23006c98'/%3E%3Cpath d='M10 11l6 5-6 5V11z' fill='white'/%3E%3C/svg%3E">
<!-- Oxanium is self-hosted from fonts/ (see css/base.css); nothing here
     is fetched from a CDN. -->
<link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <span class="topbar-mark">DUUI</span>
      <span class="topbar-title">Emotion Visualization</span>
    </div>
    <label class="video-picker">
      <span>Video</span>
      <select id="videoSelect"></select>
    </label>
  </header>

  <!-- Filled by js/panels/jobs.js while the importer or the
       cross-video identity job is running; empty and collapsed
       otherwise. -->
  <div class="job-banner" id="jobBanner" role="status" aria-live="polite" style="display:none;"></div>

  <section class="ask-panel">
    <div class="ask-panel-inner">
      <div class="ask-card">
        <div class="ask-heading">
          <span class="ask-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l1.9 4.9L19 9.8l-4.9 1.9L12 17l-1.9-5.3L5 9.8l5.1-1.9L12 3z" fill="currentColor"/><path d="M19 15l.9 2.3L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.7L19 15z" fill="currentColor"/></svg>
          </span>
          <div>
            <h2 class="ask-title">Ask about this video</h2>
            <p class="ask-subtitle">Natural-language questions over transcript, emotions, and on-screen presence.</p>
          </div>
        </div>
        <form id="askForm" class="ask-form">
          <input id="askInput" class="ask-input" type="text" autocomplete="off"
                 placeholder="e.g. &quot;where do video emotion and text emotion diverge?&quot;" />
          <button id="askSubmit" class="ask-submit" type="submit">
            <span class="btn-label">Ask</span>
          </button>
          <button id="askReset" class="ask-reset" type="button" title="Clear results and show all overlays">Reset view</button>
        </form>
        <div id="askStatus" class="ask-status" role="status" aria-live="polite"></div>
        <div id="askResults" class="ask-results"></div>
      </div>
    </div>
  </section>

  <main class="layout">
    <section class="stage">
      <div class="stage-frame" id="stageFrame">
        <video id="player" playsinline></video>
        <canvas id="overlay"></canvas>
        <!-- Hidden until the first render fills it, and whenever the
             CC button turns subtitles off. subtitleBox is the one
             translucent card -- transcript line on top, emotion label
             beneath, sharing a single background rather than each
             carrying its own pill. js/subtitles.js hides it too,
             separately from subtitleBar, for the frame-by-frame case
             where captions are on but neither line has anything to
             say at this instant (see the comment above
             SUBTITLE_GAP_TOLERANCE). -->
        <div class="subtitle-bar" id="subtitleBar" style="display:none;">
          <div class="subtitle-box" id="subtitleBox">
            <span class="subtitle-text" id="subtitleText"></span>
            <span class="subtitle-emotion" id="subtitleEmotion"></span>
          </div>
        </div>
        <div class="empty-state" id="emptyState" style="display:none;" role="status">
          <h2 class="empty-state-title" id="emptyStateTitle"></h2>
          <p class="empty-state-detail" id="emptyStateDetail"></p>
          <code class="empty-state-command" id="emptyStateCommand"></code>
        </div>
      </div>
      <div class="transport">
        <!-- Initial (paused) icon; js/player.js swaps it on play/pause
             and holds the matching pair of paths. -->
        <button id="playBtn" class="transport-btn" aria-label="Play/Pause">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.5 5v14l10.5-7z"/></svg>
        </button>
        <button id="subtitleToggle" class="transport-toggle is-on" type="button"
                aria-pressed="true" title="Hide subtitles">CC</button>
        <span class="time-readout"><span id="timeCurrent">0:00</span> <span class="time-sep">/</span> <span id="timeTotal">0:00</span></span>
        <input id="scrub" class="scrub" type="range" min="0" max="1000" value="0" step="1">
      </div>

      <!-- One panel per modality, and they live with the player rather
           than in the sidebar: they describe what is happening at the
           playhead, so they belong next to the thing being played.
           Ordered video -> audio -> text, from the most to the least
           directly observable in the frame.

           The bodies are built by js/panels/emotions.js once per video
           and then only updated in place, so the row set is not in this
           file. The empty [data-emo-filter] chips name the selected
           person while the People panel is filtering these three, and
           collapse (:empty) when nothing is selected. -->
      <div class="emotion-panels">
        <div class="panel" id="videoEmotionPanel" style="display:none;">
          <h2 class="panel-title"><span class="panel-dot dot-emotion"></span>Video emotion<span class="panel-filter" data-emo-filter></span></h2>
          <div class="emo-body" id="videoEmotionBody"></div>
        </div>

        <div class="panel" id="audioEmotionPanel" style="display:none;">
          <h2 class="panel-title"><span class="panel-dot dot-emotion"></span>Audio emotion<span class="panel-filter" data-emo-filter></span></h2>
          <div class="emo-body" id="audioEmotionBody"></div>
        </div>

        <div class="panel" id="textEmotionPanel" style="display:none;">
          <h2 class="panel-title"><span class="panel-dot dot-emotion"></span>Text emotion<span class="panel-filter" data-emo-filter></span></h2>
          <div class="emo-body" id="textEmotionBody"></div>
        </div>
      </div>
    </section>

    <!-- Who, rather than what: narrowing from this instant ("on screen
         now") out to the whole corpus ("also appears in"). Source order
         is the order they appear in both layouts -- the narrow layout
         drops this whole column below the stage rather than reordering
         anything inside it. -->
    <aside class="sidebar">
      <div class="panel">
        <h2 class="panel-title"><span class="panel-dot dot-live"></span>On screen now</h2>
        <ul class="active-list" id="activeList">
          <li class="empty-hint">No one detected at this frame.</li>
        </ul>
      </div>

      <div class="panel">
        <h2 class="panel-title"><span class="panel-dot dot-people"></span>People</h2>
        <!-- Column header for the score in each row's .person-meta --
             hidden by js/panels/people.js whenever the list is the
             "No identified persons" empty state, so it never sits
             above nothing. The title sits on this wrapping div rather
             than on the text or the icon individually, so hovering
             either one shows it -- one tooltip, two hover targets,
             instead of two titles that could drift apart. -->
        <div class="person-legend" id="personLegend" style="display:none;"
             title="Confidence that this person's face identity and voice identity recordings were fused into one identity correctly -- no relation to their emotion readings.">
          <span>match confidence</span>
          <svg class="info-icon" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
            <circle cx="8" cy="4.7" r="0.9" fill="currentColor"/>
            <path d="M8 7.4v4.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </div>
        <ul class="person-list" id="personList"></ul>
      </div>

      <div class="panel" id="crossVideoPanel" style="display:none;">
        <h2 class="panel-title"><span class="panel-dot dot-cross"></span>Also appears in</h2>
        <ul class="person-list cross-list" id="crossVideoList"></ul>
      </div>
    </aside>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
