# Convenience wrapper around the four images (each of which can also be
# built and run on its own -- see README "Running without compose").
#
#   docker compose up -d          # db -> viewer (no import)
#
# ...then open http://localhost:8010. That single command starts the
# database and the viewer but imports NOTHING -- so a fresh start shows
# an empty dropdown until you run an import. To import (whole dir or a
# single file), without restarting anything:
#
#   docker compose run --rm importer
#   docker compose run --rm importer /data/input/xmi/one_file.xmi
#
# Two jobs are NOT part of `up` and have to be asked for:
#
#   1. The importer (`importer`, profile "import") -- loads .xmi files
#      into Postgres. Run it whenever you have files to load.
#   2. Cross-video person identity (`global-identity`, profile
#      "identity") -- computed over the whole corpus at once rather than
#      per file. Run it after importing, whenever you want the viewer's
#      "Also appears in" panel to reflect the videos currently loaded:
#
#   docker compose run --rm global-identity
#
# The ONE thing you normally need to set is where your CAS files and
# videos already live. You do NOT move them -- point at them in place:
#
#   echo "DUUI_INPUT_XMI_DIR=/absolute/path/to/xmi" >> .env
#   echo "DUUI_INPUT_VIDEO_DIR=/absolute/path/to/videos" >> .env
#
# See README "Where do my .xmi files and videos have to be?".

# Pinned explicitly instead of being derived from the directory name:
# two checkouts of this stack in differently-named folders would
# otherwise get different projects (surprising), and two folders with
# the SAME name would silently share containers and volumes (worse --
# you end up debugging one while running the other).
name: duui-bundestag-stack

# Shared by `importer` (profile "import") and anything else that needs to
# run the cas-to-postgres job, so the two can never drift apart.
x-importer-common: &importer-common
  build:
    context: ./duui-video-emotion-cas-to-postgres
  image: duui-video-emotion-cas-to-postgres:latest
  environment:
    DUUI_DB_NAME: ${DUUI_DB_NAME:-duui_bundestag}
    DUUI_DB_USER: ${DUUI_DB_USER:-duui}
    DUUI_DB_PASSWORD: ${DUUI_DB_PASSWORD:-duui}
    DUUI_DB_HOST: db
    # Container-side paths (what the mounts below land on). Same names
    # as the host-side settings in .env, deliberately: .env decides
    # which host folders get mounted, these fix where they land inside
    # the container, and a native (non-Docker) run reads the .env
    # values directly.
    DUUI_INPUT_XMI_DIR: /data/input/xmi
    DUUI_INPUT_VIDEO_DIR: /data/input/videos
    DUUI_VIDEO_DIR: /data/videos
    # Which CAS view holds the video, for when it has to be recovered
    # from the CAS instead of a file. Passed through from .env so
    # setting it there actually reaches the importer.
    DUUI_VIDEO_VIEW: ${DUUI_VIDEO_VIEW:-_InitialView}
    # What to do with a .xmi whose video is already imported (matched
    # by filename). `skip` is why re-running the importer is now
    # nearly free -- it does not even load the CAS. Set `replace` (or
    # pass `--on-existing replace`) to rebuild a video's rows from a
    # re-exported CAS.
    DUUI_ON_EXISTING: ${DUUI_ON_EXISTING:-skip}
  volumes:
    # INPUT (read-only): your existing folder of .xmi files + their
    # videos, mounted in place. Nothing here is ever modified, hence
    # :ro -- your pipeline output is safe.
    #
    # `z` is the SELinux share flag. On a labelling distro (openSUSE,
    # Fedora, RHEL) the container runs as container_t and simply may not
    # read files labelled user_home_t, so without this the importer sees
    # an unreadable /data/input/xmi and reports "No .xmi files found" --
    # even running as root. `z` relabels this directory's contents to
    # container_file_t with a SHARED category, so both importer services
    # can read it. It is a no-op where SELinux isn't enforcing.
    #
    # Note it relabels RECURSIVELY: keep these pointed at a data
    # folder, never at $HOME or a system directory.
    #
    # Two separate mounts: the .xmi files and the videos they
    # reference. Point both at the same folder for the side-by-side
    # layout -- mounting one host directory twice is fine.
    #
    # The video mount falls back to DUUI_INPUT_XMI_DIR before it falls
    # back to the demo folder: setting only the .xmi directory then
    # means "the videos are in there too" (the side-by-side case),
    # instead of silently looking for your videos in the shipped
    # sample. Only with neither set does the demo pair apply.
    - ${DUUI_INPUT_XMI_DIR:-./duui-video-emotion-cas-to-postgres/src/resources/sample-input}:/data/input/xmi:ro,z
    - ${DUUI_INPUT_VIDEO_DIR:-${DUUI_INPUT_XMI_DIR:-./duui-video-emotion-cas-to-postgres/src/resources/sample-input}}:/data/input/videos:ro,z
    # OUTPUT (read-write): the video store. The importer copies each
    # CAS's companion video here, named exactly as the `videos.filename`
    # row it just wrote -- which is how the webapp (same store, mounted
    # read-only) knows which file belongs to which database rows.
    # No `z` here: by default this is a named volume, which Docker
    # already labels container_file_t. If you point DUUI_VIDEO_STORE at
    # a host path on an SELinux system, add `,z` here and on the
    # webapp's copy of this mount.
    - ${DUUI_VIDEO_STORE:-video_media}:/data/videos

services:
  db:
    build:
      context: ./db
    image: duui-video-emotion-db:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DUUI_DB_NAME:-duui_bundestag}
      POSTGRES_USER: ${DUUI_DB_USER:-duui}
      POSTGRES_PASSWORD: ${DUUI_DB_PASSWORD:-duui}
    volumes:
      # The database itself. schema.sql is baked into the image and runs
      # automatically the first time this volume is created (empty).
      - db_data:/var/lib/postgresql/data
    ports:
      # Host port only -- the other containers reach Postgres as
      # db:5432 on the compose network regardless of this. Change it if
      # you already run Postgres locally on 5432.
      - "${DUUI_DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DUUI_DB_USER:-duui} -d ${DUUI_DB_NAME:-duui_bundestag}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The cas-to-postgres job. Deliberately NOT part of `up` (the
  # "import" profile keeps it out), so a fresh stack starts with an
  # empty viewer rather than auto-importing. Run it when you have files
  # to load, without touching the running stack (paths are container
  # paths -- the .xmi directory is /data/input/xmi in here, whatever it
  # is on the host):
  #   docker compose run --rm importer                                # whole xmi dir
  #   docker compose run --rm importer /data/input/xmi/one_file.xmi   # a single file
  #
  # Importing is idempotent (rows are upserted, already-placed videos
  # are left alone), so re-running is harmless. It is not a dependency of
  # `webapp`: if one CAS in a batch fails, you still want the viewer up
  # for everything that did import.
  importer:
    <<: *importer-common
    profiles: ["import"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  # Cross-video person identity: works out which people in different
  # videos are the same person, by comparing the face/voice embeddings
  # the importer already loaded (pgvector cosine distance). Fills
  # `global_persons` + `persons.global_person_id`, which is what the
  # viewer's "Also appears in" panel reads. Nothing else populates
  # those two -- the importer deliberately leaves them empty.
  #
  # Deliberately NOT part of `up`, and deliberately not a `depends_on`
  # of anything. Two reasons:
  #
  #   1. It is corpus-wide, not per-file. Each run CLEARS every
  #      existing global identity and recomputes the whole set from
  #      scratch, so the result depends only on what is in the database
  #      and not on the order videos were imported in -- which is
  #      exactly what running it automatically per import could not
  #      give you.
  #   2. It gets more accurate the more videos are loaded, so the point
  #      to run it is after a batch of imports, not during one.
  #
  # The "identity" profile keeps it out of `up`; `run` starts it anyway:
  #   docker compose run --rm global-identity
  #
  # It takes no arguments, and its own thresholds are the only tuning
  # (see .env.example / README "Cross-video person identity"). Re-running
  # it is always safe: the clear-then-rebuild is one transaction, so an
  # interrupted run leaves the previous identities untouched.
  global-identity:
    build:
      context: ./duui-video-emotion-global-identity
    image: duui-video-emotion-global-identity:latest
    profiles: ["identity"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DUUI_DB_NAME: ${DUUI_DB_NAME:-duui_bundestag}
      DUUI_DB_USER: ${DUUI_DB_USER:-duui}
      DUUI_DB_PASSWORD: ${DUUI_DB_PASSWORD:-duui}
      DUUI_DB_HOST: db
      # Cosine distance, lower = stricter. See README before changing.
      DUUI_GLOBAL_PERSON_FACE_DISTANCE_THRESHOLD: ${DUUI_GLOBAL_PERSON_FACE_DISTANCE_THRESHOLD:-0.30}
      DUUI_GLOBAL_PERSON_VOICE_DISTANCE_THRESHOLD: ${DUUI_GLOBAL_PERSON_VOICE_DISTANCE_THRESHOLD:-0.35}
    # No volumes at all: this job never touches the .xmi input or the
    # video store. The database is its entire input and output.

  webapp:
    build:
      context: ./duui-video-emotion-visualization-webapp
    image: duui-video-emotion-visualization-webapp:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DUUI_DB_NAME: ${DUUI_DB_NAME:-duui_bundestag}
      DUUI_DB_USER: ${DUUI_DB_USER:-duui}
      DUUI_DB_PASSWORD: ${DUUI_DB_PASSWORD:-duui}
      DUUI_DB_HOST: db
      DUUI_VIDEO_DIR: /data/videos
      # Optional "Ask" panel (natural-language questions -> SQL). Leave
      # the key empty and the rest of the app works unchanged.
      DUUI_QUERY_API_KEY: ${DUUI_QUERY_API_KEY:-}
      DUUI_QUERY_BASE_URL: ${DUUI_QUERY_BASE_URL:-https://lehre.llm.texttechnologylab.org/api}
      DUUI_QUERY_MODEL: ${DUUI_QUERY_MODEL:-gondor.qwen3-vl:32b}
    volumes:
      # Same video store as the importer, read-only: the viewer only ever
      # plays videos the importer already placed, and never touches your
      # input folder at all.
      - ${DUUI_VIDEO_STORE:-video_media}:/data/videos:ro
    ports:
      - "${DUUI_WEBAPP_HOST_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:
  # Used only while DUUI_VIDEO_STORE is left at its default. Setting it
  # to a host path turns the mounts above into bind mounts and leaves
  # this declaration unused (harmless).
  video_media:
