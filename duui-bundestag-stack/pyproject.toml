[tool.pytest.ini_options]
# Runs all three suites in one go from the stack root. Each container's
# code lives entirely in its own directory under a `src/` source root, so
# all of those go on the path: that's what makes `import main`
# (importer), `import backend` (viewer) and `import identity` (the
# cross-video identity job) resolve exactly as they do in the respective
# images. The three packages are named differently on purpose -- all
# source roots share one path here, so a common name would shadow.
#
# Each directory also has its own pyproject.toml, so
# `cd duui-video-emotion-cas-to-postgres && pytest` (or either of the
# other two) works standalone -- this file is only the "run everything"
# convenience.
pythonpath = [
    "duui-video-emotion-cas-to-postgres/src",
    "duui-video-emotion-visualization-webapp/src",
    "duui-video-emotion-global-identity/src",
]
testpaths = [
    "duui-video-emotion-cas-to-postgres/tests",
    "duui-video-emotion-visualization-webapp/tests",
    "duui-video-emotion-global-identity/tests",
]
