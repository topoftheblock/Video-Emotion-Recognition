[tool.pytest.ini_options]
# Runs both suites in one go from the stack root. Each container's code
# lives entirely in its own directory, so both go on the path: that's
# what makes `import main` (importer, whose source root is its `src/`)
# and `import duui_webapp` (webapp) resolve exactly as they do inside
# the respective images.
#
# Each directory also has its own pyproject.toml, so
# `cd duui-video-emotion-cas-to-postgres && pytest` (or `cd webapp &&
# pytest`) works standalone -- this file is only the "run everything"
# convenience.
pythonpath = ["duui-video-emotion-cas-to-postgres/src", "webapp"]
testpaths = ["duui-video-emotion-cas-to-postgres/tests", "webapp/tests"]
