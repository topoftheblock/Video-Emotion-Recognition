name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: duui_bundestag
          POSTGRES_USER: duui
          POSTGRES_PASSWORD: duui
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U duui -d duui_bundestag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DUUI_DB_NAME: duui_bundestag
      DUUI_DB_USER: duui
      DUUI_DB_PASSWORD: duui
      DUUI_DB_HOST: localhost

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply schema
        run: psql "postgresql://duui:duui@localhost:5432/duui_bundestag" -f schema/schema.sql

      - name: Run tests
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build importer image
        run: docker build -f Dockerfile -t duui-importer .
      - name: Build webapp image
        run: docker build -f webapp/Dockerfile -t duui-webapp .
