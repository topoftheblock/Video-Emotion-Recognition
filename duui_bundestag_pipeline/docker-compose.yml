services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: duui_bundestag
      POSTGRES_USER: duui
      POSTGRES_PASSWORD: duui
    volumes:
      - db_data:/var/lib/postgresql/data
      # Runs once, only on first init of an empty data dir -- creates
      # the pgvector extension and all 15 tables before the webapp
      # ever connects. Re-importing a CAS still has to happen
      # separately (see comment at the bottom of this file).
      - ./schema/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duui -d duui_bundestag"]
      interval: 5s
      timeout: 5s
      retries: 10

  webapp:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DUUI_DB_NAME: duui_bundestag
      DUUI_DB_USER: duui
      DUUI_DB_PASSWORD: duui
      DUUI_DB_HOST: db
      DUUI_VIDEO_DIR: /media
      DUUI_QUERY_API_KEY: ${DUUI_QUERY_API_KEY:-}
      DUUI_QUERY_BASE_URL: ${DUUI_QUERY_BASE_URL:-https://lehre.llm.texttechnologylab.org/api}
      DUUI_QUERY_MODEL: ${DUUI_QUERY_MODEL:-gondor.qwen3-vl:32b}
    volumes:
      # Read-only: the webapp only ever plays videos the importer put
      # here (see `importer`'s /media mount below and
      # duui_parser/media.py) -- it never reads straight from ./cas,
      # so there's no dependency on that host directory's layout, and
      # `videos.filename` is genuinely the join key to "does this
      # video's file exist" (checked live -- see GET /api/videos).
      - video_media:/media:ro
    ports:
      - "8010:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-off CAS importer, not a long-running service -- excluded from
  # `docker compose up` by the "import" profile, so it only runs when
  # explicitly invoked (see README "Docker architecture" section):
  #   docker compose run --rm importer cas/your_file.xmi
  importer:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["import"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DUUI_DB_NAME: duui_bundestag
      DUUI_DB_USER: duui
      DUUI_DB_PASSWORD: duui
      DUUI_DB_HOST: db
      # Destination for the companion video file, shared with `webapp`
      # (see its /media mount) -- NOT the /app/cas input mount below,
      # which is only ever read from.
      DUUI_VIDEO_DIR: /media
      # Post-processing steps (see duui_parser/config.py) -- defaults
      # here match the Python-side defaults, spelled out so they're
      # easy to override per run, e.g.:
      #   DUUI_ENABLE_NLP_ENRICHMENT=true docker compose run --rm importer cas/x.xmi
      DUUI_ENABLE_GLOBAL_PERSON_LINKING: ${DUUI_ENABLE_GLOBAL_PERSON_LINKING:-true}
      DUUI_ENABLE_EMOTION_FUSION: ${DUUI_ENABLE_EMOTION_FUSION:-true}
      DUUI_ENABLE_NLP_ENRICHMENT: ${DUUI_ENABLE_NLP_ENRICHMENT:-false}
    volumes:
      # Read-write, input side: where the pipeline's output (a CAS
      # .xmi file plus its companion video, same filename the CAS
      # itself carries) gets dropped for import -- read-write because
      # cassis opens the .xmi file directly, which is simplest
      # read-write even though nothing here actually gets modified.
      - ./cas:/app/cas
      - ./typesystems:/app/typesystems:ro
      # Read-write, output side: after inserting this CAS's rows into
      # Postgres, duui_parser/media.py copies the matching video file
      # from /app/cas into here under the exact filename the `videos`
      # row uses -- this is what lets `webapp` (mounted read-only
      # above) know which video belongs to which DB data, without
      # either container needing to share the raw /app/cas layout.
      - video_media:/media

volumes:
  db_data:
  video_media:

# First run on an empty volume:
#   docker compose up -d db
#   (wait for it to become healthy, schema.sql applies automatically)
#   docker compose run --rm importer cas/your_file.xmi
#   docker compose up -d webapp
#
# See README "Docker architecture" for the full explanation of what
# each volume is for and which env vars matter.
