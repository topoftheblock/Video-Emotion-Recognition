<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DUUI Pipeline Player</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }
        .video-container {
            position: relative;
            width: 800px; /* Adjust based on your video aspect ratio */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #333;
        }
        video {
            width: 100%;
            display: block;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to the video controls */
        }
        .subtitles {
            position: absolute;
            bottom: 60px;
            width: 100%;
            text-align: center;
            font-size: 22px;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
        }
        .subtitle-text {
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 15px;
            border-radius: 5px;
        }
        .emotion-badge {
            color: #ffeb3b;
            font-weight: bold;
            margin-right: 10px;
        }
    </style>
</head>
<body>

    <h1>DUUI Emotion Analysis Player</h1>

    <div class="video-container">
        <video id="player" controls>
            <source src="demo_video.mp4" type="video/mp4">
            Your browser does not support HTML5 video.
        </video>
        
        <canvas id="overlay"></canvas>
        
        <div id="subtitles" class="subtitles"></div>
    </div>

    <script>
        // 1. Simulated Database Payload (Normally fetched via fetch('/api/video-data'))
        const videoData = {
            "emotions": [
                { "start_time": 0.0, "end_time": 3.0, "dominant_label": "Neutral", "text": "Welcome to the debate." },
                { "start_time": 3.1, "end_time": 6.0, "dominant_label": "Surprise", "text": "I can't believe you just said that!" },
                { "start_time": 6.1, "end_time": 10.0, "dominant_label": "Angry", "text": "This is completely unacceptable." }
            ],
            "detections": [
                // Generating some fake tracking data for demonstration (t_time, x, y, w, h)
                { "t_time": 1.0, "x": 0.40, "y": 0.20, "w": 0.15, "h": 0.25, "person": "Speaker A" },
                { "t_time": 2.0, "x": 0.41, "y": 0.20, "w": 0.15, "h": 0.25, "person": "Speaker A" },
                { "t_time": 4.0, "x": 0.42, "y": 0.21, "w": 0.15, "h": 0.25, "person": "Speaker A" },
                { "t_time": 7.0, "x": 0.45, "y": 0.22, "w": 0.15, "h": 0.25, "person": "Speaker A" }
            ]
        };

        const video = document.getElementById('player');
        const canvas = document.getElementById('overlay');
        const ctx = canvas.getContext('2d');
        const subtitlesDiv = document.getElementById('subtitles');

        // Resize canvas to exactly match video dimensions once metadata loads
        video.addEventListener('loadedmetadata', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
        });

        function drawOverlay() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const currentTime = video.currentTime;

            // --- Subtitles & Emotions ---
            const currentEmotion = videoData.emotions.find(
                emo => currentTime >= emo.start_time && currentTime <= emo.end_time
            );

            if (currentEmotion) {
                subtitlesDiv.innerHTML = `
                    <span class="subtitle-text">
                        <span class="emotion-badge">[${currentEmotion.dominant_label}]</span> 
                        ${currentEmotion.text}
                    </span>
                `;
            } else {
                subtitlesDiv.innerHTML = "";
            }

            // --- Bounding Boxes ---
            // Find boxes within a 0.5s window (increase window if you have fewer fps in your JSON)
            const activeBoxes = videoData.detections.filter(
                det => Math.abs(det.t_time - currentTime) < 0.5 
            );

            activeBoxes.forEach(box => {
                const px = box.x * canvas.width;
                const py = box.y * canvas.height;
                const pw = box.w * canvas.width;
                const ph = box.h * canvas.height;

                ctx.strokeStyle = '#00FF00';
                ctx.lineWidth = 4;
                ctx.strokeRect(px, py, pw, ph);

                ctx.fillStyle = '#00FF00';
                ctx.font = 'bold 20px Arial';
                ctx.fillText(box.person, px, py - 10);
            });

            if (!video.paused && !video.ended) {
                requestAnimationFrame(drawOverlay);
            }
        }

        // Event listeners to start the render loop
        video.addEventListener('play', () => {
            requestAnimationFrame(drawOverlay);
        });
        
        video.addEventListener('seeked', () => {
            drawOverlay(); // Update canvas instantly when user scrubs timeline
        });
    </script>
</body>
</html>
